<!-- UniLink Magic Link / OTP Email Template -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your UniLink Login Code</title>
</head>
<body style="margin: 0; padding: 0; background-color: #FDFCF7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #111827;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #FDFCF7; padding: 40px 16px;">
    <tr>
      <td align="center">
        <!-- Main Card -->
        <table role="presentation" width="100%" max-width="520" style="max-width: 520px; background-color: #ffffff; border-radius: 24px; border: 2px solid #000000; box-shadow: 0 8px 0px #000000; overflow: hidden; padding: 36px 32px; text-align: left;">
          
          <!-- Logo & Brand Header -->
          <tr>
            <td style="padding-bottom: 24px; border-bottom: 1.5px solid #F3F4F6;">
              <table role="presentation" cellspacing="0" cellpadding="0" width="100%">
                <tr>
                  <td>
                    <span style="font-size: 26px; font-weight: 900; color: #000000; letter-spacing: -0.5px;">UniLink</span>
                    <span style="display: inline-block; width: 8px; height: 8px; border-radius: 4px; background-color: #FDE047; border: 1px solid #000000; margin-left: 2px;"></span>
                  </td>
                  <td align="right">
                    <span style="background-color: #A7F3D0; border: 1px solid #000000; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 12px; color: #000000; text-transform: uppercase;">Instant Sign In</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Main Heading -->
          <tr>
            <td style="padding-top: 28px;">
              <h1 style="font-size: 22px; font-weight: 900; color: #000000; margin: 0 0 10px 0; letter-spacing: -0.5px;">
                Your UniLink Sign-In Code ⚡
              </h1>
              <p style="font-size: 14px; line-height: 22px; color: #4B5563; margin: 0 0 24px 0;">
                Use the verification code below to sign in to your UniLink account:
              </p>
            </td>
          </tr>

          <!-- 6-Digit OTP Code Highlight Box -->
          <tr>
            <td align="center" style="padding: 10px 0 24px 0;">
              <div style="background-color: #A7F3D0; border: 2px solid #000000; border-radius: 16px; padding: 18px 24px; display: inline-block; box-shadow: 0 4px 0px #000000;">
                <div style="font-size: 11px; font-weight: 800; text-transform: uppercase; color: #000000; letter-spacing: 1px; margin-bottom: 6px;">Login Code</div>
                <div style="font-size: 32px; font-weight: 900; letter-spacing: 8px; color: #000000; font-family: monospace;">{{ .Token }}</div>
              </div>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding-top: 24px; border-top: 1.5px solid #F3F4F6; text-align: center;">
              <p style="font-size: 12px; color: #9CA3AF; margin: 0 0 4px 0;">
                UniLink Campus Network · Student Collaboration Platform
              </p>
              <p style="font-size: 11px; color: #D1D5DB; margin: 0;">
                © 2026 UniLink. All rights reserved.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
